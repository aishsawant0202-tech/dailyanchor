[project]
name = "dailyanchor"
version = "0.1.0"
description = "Alexa+ MCP server providing step-by-step cognitive support and routine guidance"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
dailyanchor = "dailyanchor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dailyanchor"]
